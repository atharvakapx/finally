version: '3.8'
services:
  app:
    image: finally
    ports:
      - "8000:8000"
    volumes:
      - ../db:/app/db
    environment:
      - LLM_MOCK=true
      - OPENAI_API_KEY=
      - MASSIVE_API_KEY=
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
